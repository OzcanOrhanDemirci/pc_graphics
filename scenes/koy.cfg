amfora_kaya.small = 12
amfora_kaya.cell = 0.07
amfora.albedo = 0.18 0.10 0.06     # kil, KUM OLCEGINDE (10-04 aksam; eskisi 0,56 0,30 0,18 kumdan dort kat acikti: 'alci gibi')
amfora.coat_cover = 0.42
amfora.coat_scale = 0.18
amfora.coat_tint = 0.12 0.115 0.10
amfora.coat_normal = 0.8
amfora.sediment = 0.6
amfora.detail_albedo = 0.7
