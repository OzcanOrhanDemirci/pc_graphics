# Sahne 5 "Koy" (su alti), ikinci bolum "Amfora". Anahtar = deger; --set anahtar=deger ile ezilir; F5 yeniden yukler.
# Plan: docs/koy/PLAN_AMFORA.md (once docs/koy/PLAN.md). Bati Akdeniz: ~12 m'de bir Roma gemisinin amfora yuku, ~33 m
# otede dogal kirectasi kemeri (dibi ~20 m), gunes kemerin arkasindan.

# --- ornekleme (netlik): piksel basina sabit ornek, kenarda toplam, yeniden kurma suzgeci
sample.base = 4
sample.edge = 16              # kenarda toplam (Ozcan'in 16x MSAA citasi); panelden 32
sample.filter = 1            # 0 kutu, 1 Blackman-Harris, 2 Mitchell, 3 Gauss
sample.radius = 1.5
sample.edge_contrast = 0.04
sample.edge_id_share = 0.25   # baska yuzey + bu kadar karsitlik da kenar sayilir

# --- su: Jerlov tipi (Solonenko ve Mobley 2015), saf su Pope ve Fry 1997. Plan I-IA diyordu; IA'da gorus ~70 m ve
#     parcacik sacilmasi isik sutunu verecek kadar degil. IB: gorus ~40 m, sutunlar gorunur (docs/koy/DURUM.md).
water.n = 1.333
water.jerlov = IB
water.bp_fraction = 0.0183   # Petzold ortalama parcacik geri sacilim payi

# --- gunes ve gok (oglen, Akdeniz yazi)
sun.elevation = 50           # Amfora: ogleden once; kirilan gunes dikeyden 29 derece, sutunlar egik
sun.azimuth = 165            # -z (kemer, 175 derece) yonunde, biraz sagda: kemer ters isikta
sky.turbidity = 2.2
sky.aerosol = 0.08
sky.rim_deg = 10

# --- isik alani (firin): su sutunu, dipte kum
light.bottom = 38            # tek dip verilirse
light.bottoms = 12.6 16.6 38  # tarla, seki, duvarin dibi: her biri icin ayri isik alani (kum isigi yukari yansitir)
light.photons = 300000
light.sand_rgb = 0.50 0.45 0.36

# --- yuzey ve kostik
ocean.n = 512
ocean.patch = 16
ocean.wind = 4.0             # Amfora: hafif yaz esintisi; 2,5 m/s ile isik sutunlari secilmiyordu (A5)
ocean.wind_dir = 30
ocean.fetch_km = 2
ocean.loop = 24
ocean.min_wave = 0.35           # sakin koy: daha kisa dalgalar zayif, egimleri cozulmeyen puruzlulukte
ocean.swell = 0.05           # uzun dalgalar (8 ve 5 m), yuzeyi yavasca egiyor
ocean.unresolved_var = 0.0006
ripple.use = 1                # yuzeyin 2-35 cm'lik dalgaciklari (ara durak 3): yalniz bakista, kostik onlari gormez
ripple.on = 1
ripple.n = 1024
ripple.patch = 4              # metre: kendi kucuk karosu, 3,9 mm'de bir nokta
ripple.min_wave = 0.02        # bundan kisasi istatistikte kalir
ripple.share = 0.8            # istatistiksel egim varyansinin dalgaciklara gecen payi (gerisi 2 cm alti)
caustic.n = 1024
caustic.rays = 1024
caustic.slices = 28
caustic.z0 = 0.5
caustic.z1 = 18                 # seki 16-17 m; daha derini (duvarin dibi, uzak) son dilimi alir: 25 m ile 10,3 ms, 18 m ile 6,8
caustic.fine_z0 = 4.2         # bunun ustu yalniz isik sutunlari: yari cozunurluk
caustic.fine_z1 = 13.5        # tarla (12 m) tam cozunurlukte; kemerin dibi (16 m) ve derini yari
shaft.step0 = 0.05
shaft.grow = 0.06
shaft.max = 70
view.far = 180

# --- dunya: Amfora (PLAN_AMFORA §3). Tarla ~12 m'de bir duzlukte, -z'ye dogru kemerin havzasina (20 m) iner
floor.depth = -12.0
floor.slope = 0
floor.drop = 4.0              # tarladan kemerin sekisine (12 -> 16 m)
floor.drop_z0 = -5
floor.drop_z1 = -14
floor.far_drop = 20.0         # kemerin arkasinda duvar: maviye (36 m)
floor.far_z0 = -25
floor.far_z1 = -50
floor.far_x = 2.5             # duvar yalniz kemerin arkasinda: yanlarda seki kumla devam eder
floor.far_half = 5.5
floor.far_edge = 4.0          # kenar cizgisi metre kadar kivrilir
floor.rise = 2.5              # arkada kiyiya dogru hafif yukselis
floor.rise_z0 = 12
floor.rise_z1 = 48
floor.mound_centre = 0 0 -1   # geminin govde izi: tumsek
floor.mound_a = 5.6
floor.mound_b = 3.0
floor.mound_h = 0.45
floor.mound_deg = -75
floor.fine_x0 = -14
floor.fine_x1 = 16
floor.fine_z0 = -46
floor.fine_z1 = 14
amfora.use = 1
amfora.centre = 0 0 -1
amfora.ship_deg = -75         # gemi ekseni: kemere dogru (-z), hafif saga
amfora.count = 96
amfora.half_length = 4.2
amfora.half_width = 1.8
amfora.albedo = 0.56 0.30 0.18      # Campania kili, kirmizi-kahve (kabugun altinda yer yer gorunur)
amfora.coat_cover = 0.42
amfora.coat_scale = 0.18
amfora.coat_tint = 0.36 0.34 0.30
amfora.coat_normal = 0.8
amfora.sediment = 0.6
amfora.detail_albedo = 0.7
tex.coat_tile = 0.8                # kabuk taramasi 1,36 m'den 0,8 m'ye: damarlari mermer degil tane gibi okunsun
sediment.color = 0.36 0.34 0.29
arch.use = 1
arch.centre = 2.5 0 -20
arch.yaw_deg = 22
arch.cell = 0.07
arch.albedo = 0.24 0.22 0.19     # kabuk ve alg bagli kirectasi: kuru tasindan koyu
arch.span = 18                # ayaklarin eksenleri arasi; aciklik ~12 m
arch.rise = 9.6
arch.foot_r = 2.7
arch.top_r = 2.1
arch.foot_d = 3.8
arch.top_d = 2.6
arch.flat = 0.55               # yassi tepe: ust tabaka duzlemi
arch.warp = 1.9                # A5: uzaktan kabuk gibi okunmasin diye daha guclu bukme, egiklik, asimetri, yuksek sirtlar
arch.lean = 2.4
arch.asym = 0.25
arch.spur_h = 8.5
arch.bump = 0.42
sunvis.min = -16 -24.5 -50
sunvis.max = 20 -1 14
sunvis.voxel = 0.15
rock.centre = -7.0 0 4.0
rock.radius = 1.35
grass.centre = 7.5 0 1.5
grass.radius = 2.8
swell.amplitude = 0.12
swell.period = 7

# --- dalgic ve kamera (duz maske cami: su alti 4/3 yakin, gorus daralir)
diver.start = 0 -10.4 9
diver.yaw_deg = 180
diver.pitch_deg = -10
camera.hfov_air = 90
camera.port = 1

# --- goruntu: fiziksel pozlama, goz yari yolda uyar
display.ev = 0
display.adapt = 0.5
display.adapt_seconds = 1.5
floor.fine_step = 0.08           # dalgaciklar agda degil (normal haritasinda): ag yalniz genis bicimi tasir
floor.tint = 1.5 1.5 1.5          # Ground054 koyu bir plaj kumu (~0,27); koyun karbonat kumu daha acik (~0,4)
