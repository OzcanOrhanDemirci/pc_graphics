# gunes derinlik haritalari (isik sutunlarinin golgesi): x0 z0 x1 z1 tekstel(m)
# Ada zenginlestirme (10-04 aksam): ikinci taban (kabuk kirintili kum) yamalari, silt ve kaya dibi
# kayaliklarin kirectasi ve kumdaki suslerin renkleri KUMA GORE: kum dokusu golgelendiricide etkin ~0,1 (ada kayasinin
# 0,30'u bu yuzden buz gibi soluk); yeni malzemeler bu olcekte (10-04 aksam)
reef.rgb = 0.06 0.058 0.05
reef.coat_tint = 0.075 0.07 0.06
reef.turf_rgb = 0.028 0.032 0.014   # ust yuzlerde koyu zeytin-kahve yosun ortusu
reef.mottle = 0.15
props.stone_light = 0.13 0.125 0.11
props.stone_dark = 0.035 0.035 0.038
props.starfish_rgb = 0.30 0.055 0.028
props.pinna_rgb = 0.11 0.075 0.05
floor2.cover = 0.5             # tabanin ~%45'i kabuklu
floor2.tint = 2.2 2.1 1.95     # taramasi ana kumdan koyu kahve: suyun altinda ana kuma yakin dursun
floor2.tile = 3.0
sunmap.0 = -13 -6 13 33 0.01  # iskele: derinlik 1 cm, havadan gecis 5 mm (aralik 2,5 cm), gok 2 cm
sunmap.1 = -26 -126 30 -68 0.02   # batik: derinlik 2 cm (lumbaralar, ambar agizlari, kirik yan)
sun.sway = 1                  # golgeler dalgayla salinir
hall.box = -14 -4.6 -7 14 0 34   # iskele alti isik hacmi (Ozcan 10-04: simsiyah degil karanlik, isik duvari yok)
hall.cell = 0.25
hall.dirs = 256
sun.sway_max = 4               # isik sutunlari bundan derinde salinmaz (maliyet)
air.geometry = 1              # su ustu (iskele, ada) Snell penceresinden gorunur ve golge dusurur
air.upwell = 0.06             # asagi bakan yuze denizden yansiyan isik (dusen isigin payi)

# --- dalgic ve kamera (duz maske cami: su alti 4/3 yakin, gorus daralir)
diver.start = 3.0 -1.5 -3.3   # iskele merdiveninin dibi, beton tavanin hemen altinda
diver.yaw_deg = -9            # karanlik salonun derinligine, adaya ve gunese bakar
diver.pitch_deg = -1
diver.ceiling = 0.6           # yuzeye cikis yok: otomatik yelek bu derinlikte tutar
diver.thrust_strong = 110     # guclu palet vurusu ~0,9 m/sn
camera.hfov_air = 90
camera.port = 1

# --- basinc ve oksijen (PLAN_ADA §6): ppO2 1,6 bar (~66 m) ustunde doz birikir
o2.limit = 1.6
o2.seconds = 8
o2.steep = 4.9

# --- goruntu: fiziksel pozlama, goz yari yolda uyar
display.ev = 0
display.look_power = 1.35       # AgX 'punchy' gorunum: suyun uzun pusu resmi duzlestiriyor
display.look_sat = 1.3
display.adapt = 0.5             # goz karanliga yari yolda uyar (10-04 aksam: %30'da salonun ortasi simsiyahti)
display.adapt_seconds = 3
display.glare = 0.06             # gozun perdesi: karenin ortalama isiginin %6'si her piksele (parlak acikliklarin yaninda karanlik simsiyah olmaz)
