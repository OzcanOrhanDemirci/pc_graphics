# Sahne 5 "Koy" (su alti), ucuncu bolum "Ada". Anahtar = deger; --set anahtar=deger ile ezilir; F5 yeniden yukler.
# Plan: docs/koy/PLAN_ADA.md (once docs/koy/PLAN.md ve PLAN_AMFORA.md). Kucuk bir ada, iskele, duba koridoru; kum yavas
# yavas hep derinlesir: sig kum, amforalar (~12 m), yari yikik bir kalyon (~22 m), samandira halati maviye (~50 m).

# --- ornekleme (netlik): piksel basina sabit ornek, kenarda toplam, yeniden kurma suzgeci
sample.base = 4
sample.edge = 16              # kenarda toplam (Ozcan'in 16x MSAA citasi); panelden 32
sample.filter = 1            # 0 kutu, 1 Blackman-Harris, 2 Mitchell, 3 Gauss
sample.radius = 1.5
sample.edge_contrast = 0.04
sample.edge_id_share = 0.25   # baska yuzey + bu kadar karsitlik da kenar sayilir

# --- su: Jerlov IB (Solonenko ve Mobley 2015), saf su Pope ve Fry 1997; gorus ~40 m
water.n = 1.333
water.jerlov = IB
water.bp_fraction = 0.0183   # Petzold ortalama parcacik geri sacilim payi

# --- gunes ve gok: gunes adanin ustunden (dalgic aciga bakarken arkada ve biraz sagda), oglene yakin
sun.elevation = 60
sun.azimuth = 15             # gunese dogru yon +z (ada) ve biraz +x: koridor onden-yandan aydinlik, iskele ters isikta
sky.turbidity = 2.2
sky.aerosol = 0.08
sky.rim_deg = 3              # uzak kiyi cizgisi Snell penceresinin kenarinda (ada artik gercek geometri olacak)

# --- isik alani (firin): su sutunu ve altindaki kum; dip derinlikleri istasyonlara gore (koy.cu her noktada iki komsuyu okur)
light.bottoms = 3.5 7 12 22 35 55 110
light.photons = 300000
light.sand_rgb = 0.50 0.45 0.36
light.bottom_map = 1024

# --- yuzey ve kostik
ocean.n = 512
ocean.patch = 16
ocean.wind = 4.0             # hafif yaz esintisi: isik sutunlari secilir (A5)
ocean.wind_dir = 30
ocean.fetch_km = 2
ocean.loop = 24
ocean.min_wave = 0.35
ocean.swell = 0.05
ocean.unresolved_var = 0.0006
ripple.use = 1                # yuzeyin 2-35 cm'lik dalgaciklari: yalniz bakista, kostik onlari gormez
ripple.on = 1
ripple.n = 1024
ripple.patch = 4
ripple.min_wave = 0.02
ripple.share = 0.8
caustic.n = 1024
caustic.rays = 1024
caustic.slices = 28
caustic.z0 = 0.5
caustic.z1 = 30               # bunun altinda odaklanma 1'e soner (gunes diski zaten bulaniklastirir)
caustic.fine_z0 = 1.5         # tam cozunurluk: iskele dibi, sig kum, amforalar
caustic.fine_z1 = 14
shaft.step0 = 0.05
shaft.grow = 0.06
shaft.max = 70
view.far = 180

# --- dunya: Ada (PLAN_ADA §4). z kiyidan aciga eksi; iskelenin ucu z = 0, ada merkezi z = +60
island.centre = 0 0 60
island.radius = 35
island.height = 14
island.cliff = 3
island.slope = 1.1
island.cove_depth = 11       # iskelenin dibinde kumlu bir koy: kaya geri cekilir
island.cove_half_deg = 17
island.cell = 0.2
island.boulders = 320
floor.pier_r = 60             # iskelenin ucu ada merkezinden bu kadar uzakta (profil s = 0)
# profil dugumleri: s (iskelenin ucundan otesi, m)  derinlik (m)  egim; Hermite, birinci turev surekli
floor.profile = -45 -2.0 0.12   -30 -0.2 0.12   -18 1.2 0.11   0 3.5 0.13   30 7.5 0.14   52 11.6 0.12   60 12.6 0.10   80 18.0 0.26   95 21.6 0.12   106 23.5 0.22   125 31.5 0.45   400 155 0.45
floor.undulation = 0.25
floor.sand_wave = 0.5
floor.wander = 6
floor.shallowest = -2.5        # kumsal suyun ustune cikabilir (iskelenin kokundeki koy)
floor.fine_step = 0.12
floor.fine_min = -40 0 -190
floor.fine_max = 40 0 100
floor.extent_min = -420 0 -520
floor.extent_max = 420 0 480
floor.coarse_max = 4
floor.ripple_length = 0.09
floor.ripple_height = 0.013
floor.ripple_depth0 = 6       # bundan derinde kum dalgaciklari sonmeye baslar
floor.ripple_depth1 = 24
floor.tint = 1.5 1.5 1.5      # Ground054 koyu bir plaj kumu (~0,27); adanin karbonat kumu daha acik (~0,4)

pier.walk = -2 8 2 31          # x0 z0 x1 z1: kumsaldan gelen yol
pier.head = -11 -4 11 10       # T basligi: alcak beton plaka, altinda karanlik bir salon (Ozcan: 'korkutucu olsun')
pier.head_cols = 7
pier.head_rows = 5
pier.head_concrete = 1
pier.deck = 1.0
pier.pile_r = 0.25
pier.gap = 0.025               # eski iskele: genis araliklar
pier.missing = 0.05
pier.ladder = 3.0 0 -4         # merdiven basligin aciga bakan kenarinda
buoy.half = 15
buoy.z0 = 24
buoy.z1 = -160
samandira.pos = 0 0 -160

# amforalar: kayalarin arasinda (B4'te kayalar); simdilik eski yigin yeni yerinde
amfora.use = 1
amfora.centre = -3 0 -52
amfora.ship_deg = -60
amfora.count = 96
amfora.half_length = 4.2
amfora.half_width = 1.8
amfora_tek.centre = 0 0 -54     # tek tuk amforalar: yiginin oncesinde ve sonrasinda
amfora_tek.count = 14
amfora_tek.sherds = 12
amfora_tek.ship_deg = -90
amfora_tek.half_length = 20
amfora_tek.half_width = 10
amfora_tek.seed = 23
amfora_kaya.big = 4             # yigini tutan kayalar: asagi yamac tarafinda buyukler
amfora_kaya.small = 12
amfora_kaya.cell = 0.07
amfora.albedo = 0.56 0.30 0.18
amfora.coat_cover = 0.42
amfora.coat_scale = 0.18
amfora.coat_tint = 0.36 0.34 0.30
amfora.coat_normal = 0.8
amfora.sediment = 0.6
amfora.detail_albedo = 0.7
tex.coat_tile = 0.8
sediment.color = 0.36 0.34 0.29
batik.centre = 2 0 -97
batik.deg = 35
batik.length = 38
batik.beam = 10.5
rock.centre = -9 0 -49
rock.radius = 1.35
grass.centre = 8 0 -18
grass.radius = 2.8
swell.amplitude = 0.12
swell.period = 7
# gunes derinlik haritalari (isik sutunlarinin golgesi): x0 z0 x1 z1 tekstel(m)
sunmap.0 = -13 -6 13 33 0.01  # iskele: derinlik 1 cm, havadan gecis 5 mm (aralik 2,5 cm), gok 2 cm
sun.sway = 1                  # golgeler dalgayla salinir
sun.sway_max = 8
air.geometry = 1              # su ustu (iskele, ada) Snell penceresinden gorunur ve golge dusurur
air.upwell = 0.06             # asagi bakan yuze denizden yansiyan isik (dusen isigin payi)

# --- dalgic ve kamera (duz maske cami: su alti 4/3 yakin, gorus daralir)
diver.start = 3.0 -1.5 -3.3   # iskele merdiveninin dibi, beton tavanin hemen altinda
diver.yaw_deg = -9            # karanlik salonun derinligine, adaya ve gunese bakar
diver.pitch_deg = -1
diver.ceiling = 0.6           # yuzeye cikis yok: otomatik yelek bu derinlikte tutar
diver.thrust_strong = 110     # guclu palet vurusu ~0,9 m/sn
camera.hfov_air = 90
camera.port = 1

# --- basinc ve oksijen (PLAN_ADA §6): ppO2 1,6 bar (~66 m) ustunde doz birikir
o2.limit = 1.6
o2.seconds = 8
o2.steep = 4.9

# --- goruntu: fiziksel pozlama, goz yari yolda uyar
display.ev = 0
display.adapt = 0.3             # goz karanliga yalniz %30 uyar: iskele alti karanlik kalir
display.adapt_seconds = 3
