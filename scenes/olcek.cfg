# Sahne 7 "Ölçek" (sahilden evrenin kenarına ve Planck'a). Anahtar = değer; --set anahtar=değer ile ezilir; F5 yeniden yükler.
# Değerlerin nereden geldiği (ölçümler, kareler): docs/olcek/DURUM.md, plan docs/olcek/PLAN.md
width = 2560
height = 1440
fov = 40            # yatay görüş açısı, derece (sahilde 1,4 m'den ayak ucuna 1 m'lik bakış)
samples = 4         # piksel başına sabit örnek (her karede aynı: gren ve titreme yok)
filter = 1.5        # Blackman-Harris yeniden kurma yarıçapı, piksel
start = 0           # açılışta ekranın genişliği: 10^start m (0: 1 m, sahilde ayak ucu)

# tekerlek
wheel = 1.5         # bir tık: ekranın genişliği bu kadar katı (onluk başına ~5,7 tık)
speed.max = 20      # en hızlı: saniyede bu kadar onluk (hızlı çevrilen tekerlek; 62 onluk ~3 sn)
tour.speed = 0.5    # tur: saniyede bu kadar onluk, sabit (boşluklar hızlandırılmaz)

# zaman (PLAN §4): gözün kapağı; bundan hızlı dönen ya da yaşayan şey ortalaması olarak çizilir
shutter = 0.15      # saniye (Gauss): ~0,5 sn'den kısa dönemler halkaya ve buluta döner

# pozlama (PLAN §5: tasarlanmış, ölçeğin işlevi; görüntüden ölçülmez): "s:EV" çiftleri, güneşli dünyaya göre
# (gezegenlerin halkaları ve yıldızlar uzun pozlamada görünür, galaksinin yaygın ışığı aynı pozlamada; galaksiler nokta
# olunca onlukta ~6,6 EV açılır: ışıkları uzaklığın karesiyle söner). Ö0'ın yer tutucularına göre; Ö2-Ö3'te yeniden.
ev = -35:0, 8.3:0, 9.5:6, 10.5:10, 11.5:14, 12.5:19, 13.5:23, 22.6:23, 24:28, 25:33.5, 26:40, 27.3:48

# sınamalar
test.jump = 0.04    # olcek-sure: 8x8 blokta açıklanamayan ortalama değişim (0..1) bu eşiği aşarsa raporlanır
