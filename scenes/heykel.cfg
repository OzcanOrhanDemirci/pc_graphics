# Sahne 6 "Heykel" (G0 etüt taslağı). Anahtar = değer; --set anahtar=değer ile ezilir; F5 yeniden yükler.
width = 2560
height = 1440
fov = 30            # dikey görüş açısı, derece
zoom.max = 10000    # Katedral (pertürbasyonla); öteki adaylar zoom.max.float
detail = 0.5        # yüzey eşiği, piksel
steps = 400
bounces = 2          # sekme (yüzeyde); derinde bounces.deep

# ışık: hedefte normal gelişte ışınım (pi: beyaz albedo kendi değerinde görünür), uzaklık ve boyut bakışa göre
light.e = 3.14159
light.dist = 2.2    # kameranın hedefe uzaklığının katı
light.size = 0.05   # yarıçap, uzaklığın katı
light.spot = 0.9    # aydınlık dairenin yarıçapı, görüş yüksekliğinin katı
light.rel = -0.78, 0.55, 0.30   # ilk ışık, kameraya göre: sağ, yukarı, kameraya doğru
light.color = 1.0, 0.93, 0.84
fill = 0.07
fill.color = 0.80, 0.88, 1.0
albedo = 0.80, 0.78, 0.74
albedo.plinth = 0.16, 0.16, 0.16
albedo.floor = 0.035, 0.035, 0.035
plinth.half = 0.24
ev = 0.2
frame = 1.3         # ilk görünümde heykelin çevresindeki pay
preview.gain = 1.4    # önizlemenin birikime göre kazancı (beyaz yüzeyler arası seken ışık; --spp 0 ile 512 kıyası)
bounces.deep = 1
bounces.deep.from = 100
pert.from = 1000    # bu kattan sonra pertürbasyon (öncesinde düz float hatası 0,05 pikselin altında)
adapt.min = 32      # uyarlamalı örnekleme: bu kadar örnekten sonra netleşmiş piksel durur
adapt.rel = 0.012
adapt.abs = 0.0015
eye = 0.08          # göz ışığı (merceğin üstünde halka ışık): odaktaki ışığı anahtar ışığın bu oranı; gölge düşürmez
eye.soft = 0.35     # sanat ayarı: yakın yüzeylerde ters kare düşüş bu kadar odak uzaklığı içinde yumuşar
eye.up = 0.05
