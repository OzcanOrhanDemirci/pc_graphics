# Sahne 6 "Heykel" (Katedral, 10.000 kat). Anahtar = değer; --set anahtar=değer ile ezilir; F5 yeniden yükler.
# Değerlerin nereden geldiği (ölçümler, kareler): docs/heykel/DURUM.md
width = 2560
height = 1440
fov = 30            # dikey görüş açısı, derece
frame = 1.3         # ilk görünümde heykelin çevresindeki pay

# yakınlaşma ve geometri
zoom.max = 10000    # Katedral (pertürbasyonla); öteki adaylar zoom.max.float
pert.from = 1000    # bu kattan sonra pertürbasyon (öncesinde düz float hatası 0,05 pikselin altında)
iters.per.decade = 2   # formülün tekrarı: onda bir kat yakında bu kadar fazla (ayrıntı bitmesin)
detail = 0.5        # yüzey eşiği, piksel
steps = 400         # kameranın ışınları
steps2 = 200        # gölge ve sekme ışınları

# ışık: hedefte normal gelişte ışınım (pi: beyaz albedo kendi değerinde görünür), uzaklık ve boyut bakışa göre
light.e = 3.14159
light.dist = 2.2    # kameranın hedefe uzaklığının katı
light.size = 0.05   # yarıçap, uzaklığın katı
light.spot.first = 0.55   # ilk görünümde spot dairesi dar (ışık havuzu kaidede söner)
light.spot = 0.9    # 10 kattan itibaren: aydınlık dairenin yarıçapı, görüş yüksekliğinin katı
light.rel = -0.78, 0.55, 0.30   # ilk ışık, kameraya göre: sağ, yukarı, kameraya doğru
light.color = 1.0, 0.93, 0.84
eye.first = 0.025   # göz ışığı (merceğin üstünde halka ışık), ilk görünümde: oda karanlık kalsın
eye = 0.08          # 10 kattan itibaren: odaktaki ışığı anahtar ışığın bu oranı; gölge düşürmez
eye.soft = 0.35     # sanat ayarı: yakın yüzeylerde ters kare düşüş bu kadar odak uzaklığı içinde yumuşar
eye.up = 0.05
fill = 0.07         # tavandan sönük ışık (oda)
fill.color = 0.80, 0.88, 1.0

# malzeme ve görüntü
albedo = 0.80, 0.78, 0.74
albedo.plinth = 0.09, 0.09, 0.09
albedo.floor = 0.035, 0.035, 0.035
plinth.half = 0.24
ev = 0.2
dof = 0.003         # makro netlik alanı: mercek yarıçapı, odak uzaklığının katı (F kapatır)

# birikim
bounces = 2         # sekme (yüzeyde)
bounces.deep = 1    # bounces.deep.from katından derinde
bounces.deep.from = 100
adapt.min = 32      # uyarlamalı örnekleme: bu kadar örnekten sonra netleşmiş piksel durur
adapt.rel = 0.012
adapt.abs = 0.0015
preview.gain = 1.4  # önizlemenin birikime göre kazancı (beyaz yüzeyler arası seken ışık; --spp 0 ile 512 kıyası)
