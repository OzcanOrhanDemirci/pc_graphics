# Sahne 6 "Heykel" (Yıldız: köşesi kesilmiş Menger süngeri, 10.000 kat). Anahtar = değer; --set anahtar=değer ile ezilir; F5 yeniden yükler.
# Değerlerin nereden geldiği (ölçümler, kareler): docs/heykel/DURUM.md
width = 2560
height = 1440
fov = 30            # dikey görüş açısı, derece
heykel = yildiz     # adaylardan hangisi (yildiz, katedral, sehir, tohum, dantel); Özcan 10-05: "en net ve temiz olan"
frame = 1.3         # ilk görünümde heykelin çevresindeki pay

# yakınlaşma ve geometri
zoom.max = 10000    # Katedral (pertürbasyonla); öteki adaylar zoom.max.float
pert.from = 1000    # bu kattan sonra pertürbasyon (öncesinde düz float hatası 0,05 pikselin altında)
iters.per.decade = 2   # Katedral: formülün tekrarı, onda bir kat yakında bu kadar fazla
lod.pixels = 4      # Yıldız: çizilen en küçük delik bu kadar piksel (daha incesi gren olurdu; yaklaştıkça açılır)
detail = 0.5        # yüzey eşiği, piksel
steps = 400         # kameranın ışınları
steps2 = 200        # gölge ve sekme ışınları

# ışık: hedefte normal gelişte ışınım (pi: beyaz albedo kendi değerinde görünür), uzaklık ve boyut bakışa göre
light.e = 3.14159
light.dist = 2.2    # kameranın hedefe uzaklığının katı
light.size = 0.05   # yarıçap, uzaklığın katı
light.spot.first = 0.55   # ilk görünümde spot dairesi dar (ışık havuzu kaidede söner)
light.spot = 0.9    # 10 kattan itibaren: aydınlık dairenin yarıçapı, görüş yüksekliğinin katı
light.spot.soft = 0.15   # spotun kenarı: tam ışığın bittiği yer, dairenin bu oranında (yumuşak; sert kenar kaidede halka çiziyordu)
light.rel = -0.85, 0.45, 0.35   # ilk ışık, kameraya göre: sağ, yukarı, kameraya doğru (yıldızlı yüze soldan, yatık)
light.color = 1.0, 0.93, 0.84
eye.first = 0.025   # göz ışığı (merceğin üstünde halka ışık), ilk görünümde: oda karanlık kalsın
eye = 0.15          # 10 kattan itibaren: odaktaki ışığı anahtar ışığın bu oranı; gölge düşürmez (spotun gölgesinde de
                    # yapı okunsun: Özcan "bir yere odaklanınca çevresi de siyah oldu")
eye.soft = 0.25     # sanat ayarı: yakın yüzeylerde ters kare düşüş bu kadar odak uzaklığı içinde yumuşar
eye.up = 0.05
fill = 0.07         # tavandan sönük ışık (oda); yakınlaşmayla söner (derinde kafes zaten keser)
ambient = 0.015     # 10 kattan itibaren: beyaz yüzeylerin birbirine attığı ışık, kapalılıkla (ilk görünümde yok)
fill.color = 0.80, 0.88, 1.0

# malzeme ve görüntü
albedo = 0.80, 0.78, 0.74
albedo.plinth = 0.09, 0.09, 0.09
albedo.floor = 0.035, 0.035, 0.035
plinth.half = 0.24
ev.first = 0.6      # ilk görünümde pozlama (heykel karanlık odada), 10 kattan itibaren ev
ev = 0.2
dof = 0.003         # makro netlik alanı (F ile açılır; varsayılan kapalı): mercek yarıçapı, odak uzaklığının katı

# kare: her karede aynı (hareket ederken de dururken de); rastgele sayı yok, her örnek indeksi bütün piksellerde aynı
# sabit alt piksel noktası. Birikim yok: durunca görüntü değişmez (Özcan: "ışık oradadır")
frame.base = 4      # piksel başına örnek
frame.edge = 0      # örnekler ayrışan piksele ek (kenar); Menger'de neredeyse her yer kenar: 8'i kareyi 2-3 kat uzatıyor
frame.contrast = 0.08
light.follow = 4    # lambanın açık bir hatta dönüş hızı (1/sn; atlamaz)
filter.radius = 1.5 # yeniden kurma: Blackman-Harris, piksel (Ada'nınki)
shadow.slope = 2    # gölge ışınının yüzey eşiği, kameranınkinin katı
