# Scene 3 "Yikim": physics and scene settings (F5 reloads). Lengths m, forces N, stresses Pa.

# ---- solver
phys.substeps = 40
phys.interface_iters = 2

# ---- the reinforced-concrete frame (Y0 demo)
frame.bays_x = 2
frame.bays_z = 2
frame.storeys = 2
frame.span_x = 4.0
frame.span_z = 4.0
frame.storey_h = 3.0
frame.col_x = 0.30
frame.col_z = 0.30
frame.beam_w = 0.30
frame.beam_d = 0.50
frame.slab_t = 0.12
frame.hinge_len = 0.8
frame.beam_seg = 1.0
frame.slab_panel = 1.0
frame.density = 2500
# slab: concrete + screed, finishes, contents (~2 kN/m^2)
frame.density_slab = 4500
frame.rho_column = 0.010
frame.rho_beam = 0.008
frame.rho_slab = 0.004

# ---- materials: a 1990s building, C16 concrete and smooth S220 bars (assumptions, tuned for fun)
concrete.E = 25e9
concrete.ft = 1.6e6
concrete.fc = 16e6
concrete.cohesion = 2.0e6
concrete.mu = 0.7
concrete.open_break = 0.02
concrete.slip_break = 0.08
concrete.crush_start = 0.0035
concrete.crush_break = 0.25
concrete.residual = 0.3
concrete.damping = 0
steel.fy = 220e6
steel.dowel = 0.5
steel.break = 0.06

# ---- look (Y0: plain daylight)
sun.azimuth_deg = 300
sun.elevation_deg = 38
camera.pos = -6.5, 4.6, -7.5
camera.target = 4.2, 2.0, 4.2
camera.fov = 48
display.ev = 0
display.damage_tint = 0.35

# ---- scenarios
# kolon: at kolon.time the ground-storey columns at the grid points "i j i j ..." break loose and are shoved out
kolon.time = 1.0
kolon.list = 0 0 1 0 2 0
kolon.push = -2.5, 0, -1.0
# sarsinti: deprem.record (0 Pazarcik, 1 Antakya, 2 Yarimca, 3 Izmit, 4 Bayrakli) from deprem.offset s, x deprem.scale
deprem.time = 1.0
deprem.record = 0
deprem.offset = 25
deprem.scale = 1.0
