# Scene 3 "Yikim": physics and scene settings (F5 reloads). Lengths m, forces N, stresses Pa.

# ---- solver
phys.substeps = 40
phys.interface_iters = 2
# mass-proportional damping relative to the ground (1/s), bonded bodies only: zeta = alpha / (2 omega)
phys.damp_alpha = 1.2
# a deep overlap is pushed out at most this fast (m/s); 2 threw light brick blocks out of the shaking building
phys.max_depenetration = 0.5

# ---- which world: bina (the apartment block) or cerceve (the bare frame of Y0)
scene = bina

# ---- the apartment block (Y1): 1990s frame, shops on the ground storey, four floors of flats
bina.bays_x = 3
bina.bays_z = 4
bina.span_x = 4.0
bina.span_z = 4.0
bina.heights = 3.5 2.9 2.9 2.9 2.9
bina.col_x = 0.30
bina.col_z = 0.50
bina.beam_w = 0.30
bina.beam_d = 0.50
bina.slab_t = 0.12
bina.hinge_len = 0.8
bina.beam_seg = 1.0
bina.slab_panel = 1.0
bina.density = 2500
bina.density_slab = 4500
bina.rho_column = 0.010
bina.rho_beam = 0.008
# slab: 0.8% (real ~0.4-0.6% with top bars running over the beams into the next panel; the two-fibre slab section
# has a lever of 0.07 m against a real ~0.10 m, and a balcony's moment reaches the floor through the beam's twist)
bina.rho_slab = 0.008
bina.wall_ext = 0.20
bina.wall_int = 0.10
bina.block_w = 0.9
bina.block_h = 0.6
bina.density_wall = 1100
bina.balcony_depth = 1.3
bina.tanks = 3
bina.collectors = 3
# hollow brick infill and its mortar (assumptions)
brick.E = 3e9
brick.ft = 0.25e6
brick.fc = 3e6
brick.cohesion = 0.35e6
brick.mu = 0.7
brick.open_break = 0.01
brick.slip_break = 0.03

# ---- the reinforced-concrete frame (Y0 demo, scene = cerceve)
frame.bays_x = 2
frame.bays_z = 2
frame.storeys = 2
frame.span_x = 4.0
frame.span_z = 4.0
frame.storey_h = 3.0
frame.col_x = 0.30
frame.col_z = 0.30
frame.beam_w = 0.30
frame.beam_d = 0.50
frame.slab_t = 0.12
frame.hinge_len = 0.8
frame.beam_seg = 1.0
frame.slab_panel = 1.0
frame.density = 2500
# slab: concrete + screed, finishes, contents (~2 kN/m^2)
frame.density_slab = 4500
frame.rho_column = 0.010
frame.rho_beam = 0.008
frame.rho_slab = 0.004

# ---- materials: a 1990s building, C16 concrete and smooth S220 bars (assumptions, tuned for fun)
concrete.E = 25e9
concrete.ft = 1.6e6
concrete.fc = 16e6
concrete.cohesion = 2.0e6
concrete.mu = 0.7
concrete.open_break = 0.02
concrete.slip_break = 0.08
concrete.crush_start = 0.0035
concrete.crush_break = 0.25
concrete.residual = 0.3
steel.fy = 220e6
steel.dowel = 0.5
steel.break = 0.06

# ---- look (Y0: plain daylight)
sun.azimuth_deg = 300
sun.elevation_deg = 38
camera.pos = -15.0, 9.0, -17.0
camera.target = 6.0, 6.5, 7.0
camera.fov = 50
display.ev = 0
display.damage_tint = 0.35
# the reinforcing bars (display, B toggles): drawn across a crack wider than bar.gap while the fibre holds, as stubs
# out of both faces once it is gone (m). 20 mm bars, as in the columns; stubs: the bare length of a failed member's bars
bar.radius = 0.01
bar.gap = 0.005
bar.stub = 0.25
# the live window: render size (scaled to the screen) and samples a frame (more while nothing moves). The render runs
# beside the physics on the same GPU: 6 kept 55 fps on the apartment, 16 slowed the physics by 5 ms (measured, RTX 4080)
display.width = 1920
display.height = 1080
display.spp = 6
# denoising in the window (G cycles): 0 raw (grain: the sky light and the sun's disc get a few rays a frame while things
# move), 1 our filter (temporal along each body's motion + edge-stopping a-trous, ~2.4 ms, ~54 fps), 2 the OptiX AI
# denoiser (cleanest, but 9.7 ms and the physics slows to 23 ms: ~40 fps, measured). Clips and stills: display.denoise_clip
display.denoise = 1
display.filter_passes = 4
camera.mouse = 0.0025
# a click: a wrecking ball thrown at what is under the cursor, from the camera's side, at most once a second. Its
# power (the slider, 0..1; darbe.guc to start with) sets size and speed together: 0.5 the balanced throw
# (darbe.yaricap at darbe.hiz), 0 the smallest and slowest (darbe.min_*), 1 the biggest and fastest (darbe.max_*),
# each half on a log scale; the size is the nearest of darbe.boylar (radii, m; darbe.toplar balls of each, the
# oldest thrown again). It appears darbe.mesafe metres short of the point, or a quarter second of flight back when
# that is more. Cast steel. What each power did to the building: docs/yikim/DURUM.md
darbe.guc = 0.5
darbe.yaricap = 0.5
darbe.hiz = 14
darbe.min_yaricap = 0.25
darbe.min_hiz = 8
darbe.max_yaricap = 0.7
darbe.max_hiz = 70
darbe.boylar = 0.25 0.3 0.35 0.42 0.5 0.6 0.7
darbe.toplar = 4
darbe.mesafe = 6
darbe.yogunluk = 7850

# ---- scenarios
# kolon: at kolon.time the ground-storey columns at the grid points "i j i j ..." break loose and are shoved out
kolon.time = 1.0
kolon.list = 0 0 1 0
# 1: the columns vanish (an explosive charge); 0: they are cut loose and shoved out with kolon.push
kolon.remove = 1
kolon.push = -2.5, 0, -1.0
# sarsinti: a quake of deprem.magnitude (3..9, src/scenes/yikim/quake.cpp) at deprem.time, deprem.seconds long (0: the
# magnitude's own, < 0: until stopped); the live scene starts at deprem.magnitude
deprem.time = 1.0
deprem.magnitude = 6
deprem.seconds = 0
# darbe: at darbe.time a ball of power darbe.guc comes from darbe.from (offset, m) at the ground-storey column at grid
# point darbe.kolon (i, j), 0.5 m under its middle, or at the point darbe.hedef when that is given
darbe.time = 1.0
darbe.kolon = 0, 0, 0
darbe.from = -8, 1, -4
