# Scene 3 "Yikim": physics and scene settings (F5 reloads). Lengths m, forces N, stresses Pa.

# ---- solver
phys.substeps = 40
phys.interface_iters = 2
# mass-proportional damping relative to the ground (1/s), bonded bodies only: zeta = alpha / (2 omega)
phys.damp_alpha = 1.2
# a deep overlap is pushed out at most this fast (m/s); 2 threw light brick blocks out of the shaking building
phys.max_depenetration = 0.5

# ---- which world: bina (the apartment block) or cerceve (the bare frame of Y0)
scene = bina

# ---- the apartment block (Y1): 1990s frame, shops on the ground storey, four floors of flats
bina.bays_x = 3
bina.bays_z = 4
bina.span_x = 4.0
bina.span_z = 4.0
bina.heights = 3.5 2.9 2.9 2.9 2.9
bina.col_x = 0.30
bina.col_z = 0.50
bina.beam_w = 0.30
bina.beam_d = 0.50
bina.slab_t = 0.12
bina.hinge_len = 0.8
bina.beam_seg = 1.0
bina.slab_panel = 1.0
bina.density = 2500
bina.density_slab = 4500
bina.rho_column = 0.010
bina.rho_beam = 0.008
# slab: 0.8% (real ~0.4-0.6% with top bars running over the beams into the next panel; the two-fibre slab section
# has a lever of 0.07 m against a real ~0.10 m, and a balcony's moment reaches the floor through the beam's twist)
bina.rho_slab = 0.008
bina.wall_ext = 0.20
bina.wall_int = 0.10
bina.block_w = 0.9
bina.block_h = 0.6
bina.density_wall = 1100
bina.balcony_depth = 1.3
bina.tanks = 3
bina.collectors = 3
# hollow brick infill and its mortar (assumptions)
brick.E = 3e9
brick.ft = 0.25e6
brick.fc = 3e6
brick.cohesion = 0.35e6
brick.mu = 0.7
brick.open_break = 0.01
brick.slip_break = 0.03

# ---- which building stands (the live scene's panel chooses): apartman, gokdelen (the tower), ev (the house)
yapi = apartman

# ---- the tower (gokdelen): a residential tower, a frame around a plain-concrete core (the lift shaft, no floor in it),
# brick infill with large windows, a glass lobby at the front. 30 storeys, 97 m. Same materials as the apartment;
# larger columns (30x50 cm ones would crush: twenty floors put ~15 MPa on them, the concrete takes 16)
gokdelen.bays_x = 3
gokdelen.bays_z = 3
gokdelen.span_x = 5.0
gokdelen.span_z = 5.0
gokdelen.storeys = 30
gokdelen.ground_h = 4.2
gokdelen.storey_h = 3.2
gokdelen.col_x = 0.40
gokdelen.col_z = 0.90
gokdelen.beam_w = 0.40
gokdelen.beam_d = 0.60
gokdelen.slab_t = 0.14
gokdelen.hinge_len = 0.9
gokdelen.beam_seg = 2.3
gokdelen.slab_panel = 2.3
gokdelen.density = 2500
gokdelen.density_slab = 4500
gokdelen.rho_column = 0.015
gokdelen.rho_beam = 0.010
gokdelen.rho_slab = 0.006
gokdelen.core_t = 0.30
gokdelen.core_seg = 2.2
# the core's steel ratio: 0 plain concrete (a reinforced one stood alone once the frame around it was gone; -1: a column's)
gokdelen.core_rho = 0
gokdelen.block_w = 1.5
gokdelen.block_h = 1.0
gokdelen.window_w = 2.4
gokdelen.window_h = 1.6
gokdelen.sill = 0.8
gokdelen.camera_pos = -70, 26, -82
gokdelen.camera_target = 7.5, 45, 7.5

# ---- the seismic tower (sismik): base isolation, after Japanese practice (Özcan: "Sallandıkça sallanıyor ama
# yıkılmıyor"). Glass in tiers (sismik.tiers bays square, sismik.tier_storeys high, each centred on the one below) and a
# steel spire (sismik.spire: width height, from the bottom up), on a concrete mat that rests on rubber isolators: soft
# across (sismik.iso_period: the tower on them swings that slowly), stiff in compression, never breaking. A curb round
# the mat, sismik.moat away, rides with the ground. Columns larger than the tower's (twenty-six storeys on a bay), concrete
# and bars high-strength (sismik.fc, ft, fy: the others' 16 MPa crushed at the foot); measured: docs/yikim/DURUM.md
sismik.span_x = 5.0
sismik.span_z = 5.0
sismik.tiers = 5 3 1
sismik.tier_storeys = 10 10 6
sismik.ground_h = 4.5
sismik.storey_h = 3.6
sismik.col_x = 0.60
sismik.col_z = 1.00
sismik.beam_w = 0.60
sismik.beam_d = 0.70
sismik.slab_t = 0.16
sismik.hinge_len = 1.0
sismik.beam_seg = 2.3
sismik.slab_panel = 2.3
sismik.density = 2500
sismik.density_slab = 4500
sismik.rho_column = 0.020
sismik.rho_beam = 0.012
sismik.rho_slab = 0.006
sismik.spire = 1.6 6 1.1 6 0.7 6 0.4 5 0.2 4
# the spire: hollow steel, well anchored (a solid one, 2500 kg/m^3 with 3% bars, whipped off the top at magnitude 8)
sismik.spire_rho = 0.06
sismik.spire_density = 1200
sismik.fc = 40e6
sismik.ft = 3.0e6
sismik.fy = 420e6
sismik.mat_t = 1.0
sismik.iso_period = 3.5
sismik.iso_len = 0.5
sismik.moat = 0.9
sismik.glass_w = 5.0
sismik.camera_pos = -85, 32, -100
sismik.camera_target = 12.5, 52, 12.5

# ---- the house (ev): one storey under its ceiling slab, a gable roof (tiles on boards: light) with a chimney
ev.bays_x = 2
ev.bays_z = 3
ev.span_x = 4.5
ev.span_z = 4.0
ev.storeys = 1
ev.storey_h = 3.0
ev.col_x = 0.25
ev.col_z = 0.30
ev.beam_w = 0.25
ev.beam_d = 0.40
ev.slab_t = 0.12
ev.hinge_len = 0.6
ev.beam_seg = 1.5
ev.slab_panel = 1.5
ev.density = 2500
ev.density_slab = 4000
ev.rho_column = 0.010
ev.rho_beam = 0.008
ev.rho_slab = 0.006
ev.roof_pitch = 30
ev.roof_t = 0.12
ev.overhang = 0.5
ev.gable_overhang = 0.3
ev.roof_strip = 1.6
ev.density_roof = 1000
ev.camera_pos = -9, 4, -11
ev.camera_target = 4.5, 2.4, 6

# ---- the reinforced-concrete frame (Y0 demo, scene = cerceve)
frame.bays_x = 2
frame.bays_z = 2
frame.storeys = 2
frame.span_x = 4.0
frame.span_z = 4.0
frame.storey_h = 3.0
frame.col_x = 0.30
frame.col_z = 0.30
frame.beam_w = 0.30
frame.beam_d = 0.50
frame.slab_t = 0.12
frame.hinge_len = 0.8
frame.beam_seg = 1.0
frame.slab_panel = 1.0
frame.density = 2500
# slab: concrete + screed, finishes, contents (~2 kN/m^2)
frame.density_slab = 4500
frame.rho_column = 0.010
frame.rho_beam = 0.008
frame.rho_slab = 0.004

# ---- materials: a 1990s building, C16 concrete and smooth S220 bars (assumptions, tuned for fun)
concrete.E = 25e9
concrete.ft = 1.6e6
concrete.fc = 16e6
concrete.cohesion = 2.0e6
concrete.mu = 0.7
concrete.open_break = 0.02
concrete.slip_break = 0.08
concrete.crush_start = 0.0035
concrete.crush_break = 0.25
concrete.residual = 0.3
steel.fy = 220e6
steel.dowel = 0.5
steel.break = 0.06

# ---- look (Y0: plain daylight)
sun.azimuth_deg = 300
sun.elevation_deg = 38
camera.pos = -15.0, 9.0, -17.0
camera.target = 6.0, 6.5, 7.0
camera.fov = 50
display.ev = 0
display.damage_tint = 0.35
# the reinforcing bars (display, B toggles): drawn across a crack wider than bar.gap while the fibre holds, as stubs
# out of both faces once it is gone (m). 20 mm bars, as in the columns; stubs: the bare length of a failed member's bars
bar.radius = 0.01
bar.gap = 0.005
bar.stub = 0.25
# the live window: render size (scaled to the screen) and samples a frame (more while nothing moves). The render runs
# beside the physics on the same GPU: 6 kept 55 fps on the apartment, 16 slowed the physics by 5 ms (measured, RTX 4080)
display.width = 1920
display.height = 1080
display.spp = 6
# denoising in the window (G cycles): 0 raw (grain: the sky light and the sun's disc get a few rays a frame while things
# move), 1 our filter (temporal along each body's motion + edge-stopping a-trous, ~2.4 ms, ~54 fps), 2 the OptiX AI
# denoiser (cleanest, but 9.7 ms and the physics slows to 23 ms: ~40 fps, measured). Clips and stills: display.denoise_clip
display.denoise = 1
display.filter_passes = 4
camera.mouse = 0.0025
# a click: a wrecking ball thrown at what is under the cursor, from the camera's side, at most once a second. Its
# power (the slider, 0..1; darbe.guc to start with) sets size and speed together: 0.5 the balanced throw
# (darbe.yaricap at darbe.hiz), 0 the smallest and slowest (darbe.min_*), 1 the biggest and fastest (darbe.max_*),
# each half on a log scale; the size is the nearest of darbe.boylar (radii, m; darbe.toplar balls of each, the
# oldest thrown again). It appears darbe.mesafe metres short of the point, or a quarter second of flight back when
# that is more. Cast steel. What each power did to the building: docs/yikim/DURUM.md
# The right end is overdone on purpose, for fun (Özcan: "Son hali cidden abartı olsun"): a 5 m ball of ~500 t at
# 110 m/s, under the solver's 120 m/s guard (PhysParams::maxSpeed); the old right end (0.7 m, 11 t, 70 m/s) only
# damaged the tower
darbe.guc = 0.5
darbe.yaricap = 0.5
darbe.hiz = 14
darbe.min_yaricap = 0.25
darbe.min_hiz = 8
darbe.max_yaricap = 2.5
darbe.max_hiz = 110
darbe.boylar = 0.25 0.3 0.35 0.42 0.5 0.6 0.7 0.85 1.0 1.25 1.5 1.8 2.1 2.5
darbe.toplar = 4
darbe.mesafe = 6
darbe.yogunluk = 7850

# ---- scenarios
# kolon: at kolon.time the ground-storey columns at the grid points "i j i j ..." break loose and are shoved out
kolon.time = 1.0
kolon.list = 0 0 1 0
# 1: the columns vanish (an explosive charge); 0: they are cut loose and shoved out with kolon.push
kolon.remove = 1
kolon.push = -2.5, 0, -1.0
# sarsinti: a quake of deprem.magnitude (3..9, src/scenes/yikim/quake.cpp) at deprem.time, deprem.seconds long (0: the
# magnitude's own, < 0: until stopped); the live scene starts at deprem.magnitude
deprem.time = 1.0
deprem.magnitude = 6
deprem.seconds = 0
# darbe: at darbe.time a ball of power darbe.guc comes from darbe.from (offset, m) at the ground-storey column at grid
# point darbe.kolon (i, j), 0.5 m under its middle, or at the point darbe.hedef when that is given
darbe.time = 1.0
darbe.kolon = 0, 0, 0
darbe.from = -8, 1, -4
