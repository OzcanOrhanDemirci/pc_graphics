# Scene 3 "Yikim": physics and scene settings (F5 reloads). Lengths m, forces N, stresses Pa.

# ---- solver
phys.substeps = 40
phys.interface_iters = 2

# ---- which world: bina (the apartment block) or cerceve (the bare frame of Y0)
scene = bina

# ---- the apartment block (Y1): 1990s frame, shops on the ground storey, four floors of flats
bina.bays_x = 3
bina.bays_z = 4
bina.span_x = 4.0
bina.span_z = 4.0
bina.heights = 3.5 2.9 2.9 2.9 2.9
bina.col_x = 0.30
bina.col_z = 0.50
bina.beam_w = 0.30
bina.beam_d = 0.50
bina.slab_t = 0.12
bina.hinge_len = 0.8
bina.beam_seg = 1.0
bina.slab_panel = 1.0
bina.density = 2500
bina.density_slab = 4500
bina.rho_column = 0.010
bina.rho_beam = 0.008
# slab: 0.8% (real ~0.4-0.6% with top bars running over the beams into the next panel; the two-fibre slab section
# has a lever of 0.07 m against a real ~0.10 m, and a balcony's moment reaches the floor through the beam's twist)
bina.rho_slab = 0.008
bina.wall_ext = 0.20
bina.wall_int = 0.10
bina.block_w = 0.9
bina.block_h = 0.6
bina.density_wall = 1100
bina.balcony_depth = 1.3
bina.tanks = 3
bina.collectors = 3
# hollow brick infill and its mortar (assumptions)
brick.E = 3e9
brick.ft = 0.25e6
brick.fc = 3e6
brick.cohesion = 0.35e6
brick.mu = 0.7
brick.open_break = 0.01
brick.slip_break = 0.03

# ---- the reinforced-concrete frame (Y0 demo, scene = cerceve)
frame.bays_x = 2
frame.bays_z = 2
frame.storeys = 2
frame.span_x = 4.0
frame.span_z = 4.0
frame.storey_h = 3.0
frame.col_x = 0.30
frame.col_z = 0.30
frame.beam_w = 0.30
frame.beam_d = 0.50
frame.slab_t = 0.12
frame.hinge_len = 0.8
frame.beam_seg = 1.0
frame.slab_panel = 1.0
frame.density = 2500
# slab: concrete + screed, finishes, contents (~2 kN/m^2)
frame.density_slab = 4500
frame.rho_column = 0.010
frame.rho_beam = 0.008
frame.rho_slab = 0.004

# ---- materials: a 1990s building, C16 concrete and smooth S220 bars (assumptions, tuned for fun)
concrete.E = 25e9
concrete.ft = 1.6e6
concrete.fc = 16e6
concrete.cohesion = 2.0e6
concrete.mu = 0.7
concrete.open_break = 0.02
concrete.slip_break = 0.08
concrete.crush_start = 0.0035
concrete.crush_break = 0.25
concrete.residual = 0.3
concrete.damping = 0
steel.fy = 220e6
steel.dowel = 0.5
steel.break = 0.06

# ---- look (Y0: plain daylight)
sun.azimuth_deg = 300
sun.elevation_deg = 38
camera.pos = -15.0, 9.0, -17.0
camera.target = 6.0, 6.5, 7.0
camera.fov = 50
display.ev = 0
display.damage_tint = 0.35

# ---- scenarios
# kolon: at kolon.time the ground-storey columns at the grid points "i j i j ..." break loose and are shoved out
kolon.time = 1.0
kolon.list = 0 0 1 0
# 1: the columns vanish (an explosive charge); 0: they are cut loose and shoved out with kolon.push
kolon.remove = 1
kolon.push = -2.5, 0, -1.0
# sarsinti: deprem.record (0 Pazarcik, 1 Antakya, 2 Yarimca, 3 Izmit, 4 Bayrakli), x deprem.scale
deprem.time = 1.0
deprem.record = 0
# seconds of the record skipped; negative: start 15 s before its strongest moment
deprem.offset = -1
deprem.scale = 1.0
