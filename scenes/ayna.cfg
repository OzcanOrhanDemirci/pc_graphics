# Sahne 9 "Ayna": ayna labirenti, en iyi yansıma. Anahtar = değer; --set anahtar=değer ile ezilir; F5 yeniden yükler.
# Ayar paneli yok (Özcan 2026-10-07): kaliteyi 2560x1440'ta bu dosya belirler, hedef 30-40 FPS.
width = 2560
height = 1440
samples = 6            # pikselde sabit örnek (6 kale deseni; 4 ve 8 Direct3D desenleri, 16 referans): 1440p en kötü bakışta ~31 ms
cone.scale = 0.6       # ışının izdüşümü: metre başına bu kadar piksel açısı (desenler bununla süzülür)
min.weight = 0.000977  # yolun ağırlığı bunun altına inince biter (1/1024; 1/4096 ile fark piksellerin %0,007'si, 1,3 ms)
steps = 1500           # bir yolun geçebileceği hücre sınırı

exposure = 0.12
bloom = 0.04
vignette = 0.2

# labirent (60° üçgen ızgara)
maze.radius = 3        # altıgenin yarıçapı (kenar)
maze.seed = 7
maze.loops = 4
maze.edge = 1.6        # ızgara kenarı (m)
maze.wall = 0.09       # duvar kalınlığı
maze.column = 0.15     # sütun yarıçapı (köşede 6 cm öne çıkar)
maze.window = 1.20     # pencerenin pervazlar arası genişliği
maze.arch = 0.64       # at nalı kemerin yarıçapı (şişkinliği sütuna 1 cm kalır)
maze.arch.centre = 2.05
maze.ceiling = 3.4
maze.glass = 0.006     # aynanın camı (gümüşün iki yanında)

# biz: krom küre
sphere.radius = 0.175
spot.outer = 28        # ışığımızın konisi (derece)
spot.inner = 12

# bırakılan lambalar
lamp.radius = 0.03
lamp.share = 0.03      # lambanın şiddeti = ışığımızın tepe şiddeti x bu (aynı ışık akısı, her yöne)
lamp.max = 8
lamp.ahead = 0.32

# pus (hafif, düzgün; izotrop saçılma, metre başına)
haze.sigma = 0.006
haze.absorb = 0.001
haze.g = 0.6           # ileri saçılma (Henyey-Greenstein): sis makinesinin damlacıkları, toz; ışığımızın göze geri saçtığı parıltı az
haze.min.weight = 0.03

# hüzmeler ve lambaların ışık haritası
beams = 3              # 3: ışığımız da her karede ışık haritasına pişer (kare çekirdeği yalın); 1: piksel başına hüzme, 0: gölge ışını (araçlar)
beam.eps = 0.01        # bu ışınımın altında kalan hüzme aranmaz (pozlamayla ölçeklenir)
beam.bulge = 0         # at nalının şişkinliğinden geçen hüzmeler (pahalı, kazancı küçük: kapalı)
lightmap = 1
lightmap.texel = 0.01
lightmap.eps = 0.5
bake.ss = 1            # texel = mean of k x k points over its area (1: its centre); video captures use 8: no stepped, crawling shadow edges

# aynanın hayalet görüntüsü (camın ön yüzünün yansıması, ışıklar için): ölçüldü, görünür etkisi piksellerin %0,001'i,
# maliyeti +%40 → kapalı
ghost.mirrors = 0
ghost.cells = 10

# kürenin önündeki yarık (ışığımız buradan çıkar; aynada parlar)
slit.width = 0.08
slit.height = 0.014
spot.radius = 0.03
glossy.blur = 6        # cilalı taşın (%5) yansımasında görülen desenler bu kat geniş süzülür (ince ayrıntı o yansımada görünmez)
graze.clamp = 0.05     # sıyırarak bakılan yüzeyde izdüşüm 1 / max(cos, bu) kat geniş
recon = 0.12           # yeniden yapılandırma: pikselin örnekleri komşulara bu yan ağırlıkla taşar (Blackman-Harris kuyruğu gibi): kenar titremesi az, keskinlik -%10 (0: yalnız kendi örnekleri)
