# Scene 4 "Tanecik": settings (F5 reloads). Lengths m, colours linear RGB.

# ---- the body
# lattice spacing = the particles' diameter (5-7 mm, chosen by measurement in T1)
beden.aralik = 0.007
beden.yogunluk = 1000
# each particle moved off the lattice by up to this share of the spacing (fixed by a hash: the same body every time)
beden.titresim = 0.25
# the physics' body (T2): bonds between particles closer than this many spacings; a bone thinner than this many
# spacings takes the particles within it of its axis (a finger bone between lattice points would be empty)
beden.bag_yaricap = 1.5
beden.kemik_en_az = 0.75
# the skin mesh's grid cell (surface nets)
beden.deri_hucre = 0.004

# ---- the look: glass (1) or skin (0); particles shown: 0 all, 1 sparse, 2 none
gorunum.cam = 1
gorunum.tanecik = 0
# radius as drawn, a share of the spacing; the sparse view keeps this share of the particles
gorunum.tanecik_yaricap = 0.3
gorunum.seyrek_yaricap = 0.42
gorunum.seyrek_pay = 0.1

# glass: a thin skin-tinted shell. Optical depth at normal incidence (sigma * thickness): transmittance exp(-d) per
# crossing, deeper towards the silhouette (d / |cos|); a frosted share scatters like skin
cam.optik_derinlik = 0.10 0.22 0.30
cam.buzlu = 0.1
cam.buzlu_renk = 0.62 0.42 0.33
cam.f0 = 0.04
deri.renk = 0.55 0.36 0.27
deri.f0 = 0.028
deri.parlaklik = 30
kemik.renk = 0.78 0.72 0.60
# blood-filled, as a body is (Özcan: the gore he meant is a hyper-real face and body; this is a mannequin)
tanecik.renk = 0.50 0.06 0.05
sivi.renk = 0.13 0.006 0.006
# the free liquid: a wet mirror over its colour (Fresnel at normal incidence); capacities of its surface
sivi.f0 = 0.03
# a clear liquid instead (water, honey: T5): refractive index and absorption per metre (water: barely, more in red)
sivi.berrak = 0
sivi.kirilma = 1.33
sivi.sogurma = 0.45 0.06 0.02
sivi.ek_tanecik = 300000
sivi.kose = 2000000
sivi.ucgen = 4000000
sivi.blok = 65536
# the floor as a canvas: settled liquid soaks in (a map leke.boy metres square around him); its colour, and the litres
# per m2 that make it all but opaque
leke.boy = 6.0
leke.cozunurluk = 3072
leke.renk = 0.16 0.028 0.022
leke.derinlik = 0.15

# ---- the studio: a white cyclorama
studyo.renk = 0.78 0.77 0.75
studyo.duvar_z = -4.0
studyo.kavis = 1.6
studyo.yukseklik = 7.0
studyo.genislik = 14.0
studyo.on_z = 14.0

# ---- light: soft boxes (konum, hedef, en, boy, parlaklik), the open studio's ambient, diffuse bounces
isik.sayi = 4
isik.ortam = 0.24 0.24 0.25
isik.sekme = 2

# ---- camera (circles the figure)
kamera.hedef = 0 0.95 0
kamera.yaw_deg = 0
kamera.pitch_deg = 3
kamera.uzaklik = 4.2
kamera.fov = 30
kamera.fare = 0.004

# ---- display
display.width = 1920
display.height = 1080
display.spp = 2
goruntu.ev = 0.5

# ---- physics (T1): the particle solver (particles.h). Lengths m.
# particle spacing (= diameter); the body's lattice uses beden.aralik
fizik.aralik = 0.007
fizik.alt_adim = 20
fizik.yineleme = 2
fizik.diverjans = 1
fizik.bag_yineleme = 2
# the fluid kernel's radius, in spacings; the density constraint's relaxation (a share of the lattice's denominator)
fizik.cekirdek = 1.8
fizik.gevseme = 0.3
fizik.tek_yonlu = 1
fizik.scorr_k = 0
# XSPH viscosity per 1/60 s; cohesion (Akinci 2013), peak m/s^2 (0: off)
fizik.xsph = 0.01
fizik.yapisma = 5
fizik.mu_statik = 0.6
fizik.mu_dinamik = 0.5
fizik.zemin_mu_statik = 0.6
fizik.zemin_mu_dinamik = 0.5
fizik.sivi_zemin_mu = 0.3
fizik.en_hiz = 60
# test switches: 0 turns the mechanism off (a test must then fail)
fizik.yogunluk = 1
fizik.baglar = 1

# ---- the solver's tests and clips (tanecik_tests.cpp)
test.dusus.yukseklik = 1.0
test.hacim.n = 40
test.hacim.yukseklik = 40
test.hacim.sure = 3.0
# Martin & Moyce: column width a (m), depth in particles, tank length in a
test.baraj.a = 0.3
test.baraj.derinlik = 10
test.baraj.tank = 6.0
test.baraj.kare_bolme = 2
# the water balloon: radius; the membrane: density (a 7 mm particle stands for a sheet), bonds to neighbours within
# this many spacings, compliance (m/N; rubber: E t ~ 450 N/m, a bond of a triangular lattice ~ 400 N/m), breaking and
# crushing strain (it tears before its holes would let a water particle through, ~70%); the shot's radius in
# spacings; the cubes (side, densities, drop height above the balloon)
test.balon.yaricap = 0.1
test.balon.deri_yogunluk = 200
test.balon.bag_uzaklik = 1.5
test.balon.uyum = 1e-3
test.balon.kopma = 0.7
test.balon.ezilme = 0.95
test.balon.delik = 2.5
test.balon.kup = 0.12
test.balon.hafif_kup = 100
test.balon.agir_kup = 7850
test.balon.kup_yukseklik = 0.3
test.klip.genislik = 1280
test.klip.yukseklik = 720
test.klip.spp = 24
