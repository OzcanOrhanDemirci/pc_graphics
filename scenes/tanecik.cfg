# Scene 4 "Tanecik": settings (F5 reloads). Lengths m, colours linear RGB.

# ---- the body
# lattice spacing = the particles' diameter (5-7 mm, chosen by measurement in T1)
beden.aralik = 0.007
beden.yogunluk = 1000
# each particle moved off the lattice by up to this share of the spacing (fixed by a hash: the same body every time)
beden.titresim = 0.25
# the skin mesh's grid cell (surface nets)
beden.deri_hucre = 0.004

# ---- the look: glass (1) or skin (0); particles shown: 0 all, 1 sparse, 2 none
gorunum.cam = 1
gorunum.tanecik = 0
# radius as drawn, a share of the spacing; the sparse view keeps this share of the particles
gorunum.tanecik_yaricap = 0.2
gorunum.seyrek_yaricap = 0.42
gorunum.seyrek_pay = 0.1

# glass: a thin skin-tinted shell. Optical depth at normal incidence (sigma * thickness): transmittance exp(-d) per
# crossing, deeper towards the silhouette (d / |cos|); a frosted share scatters like skin
cam.optik_derinlik = 0.10 0.22 0.30
cam.buzlu = 0.1
cam.buzlu_renk = 0.62 0.42 0.33
cam.f0 = 0.04
deri.renk = 0.55 0.36 0.27
deri.f0 = 0.028
deri.parlaklik = 30
kemik.renk = 0.78 0.72 0.60
# the body at rest is pale; the only saturated colour is the liquid that damage sets free (tek renk + tek vurgu)
tanecik.renk = 0.80 0.55 0.50
sivi.renk = 0.35 0.02 0.02

# ---- the studio: a white cyclorama
studyo.renk = 0.78 0.77 0.75
studyo.duvar_z = -4.0
studyo.kavis = 1.6
studyo.yukseklik = 7.0
studyo.genislik = 14.0
studyo.on_z = 14.0

# ---- light: soft boxes (konum, hedef, en, boy, parlaklik), the open studio's ambient, diffuse bounces
isik.sayi = 4
isik.ortam = 0.24 0.24 0.25
isik.sekme = 2

# ---- camera (circles the figure)
kamera.hedef = 0 0.95 0
kamera.yaw_deg = 0
kamera.pitch_deg = 3
kamera.uzaklik = 4.2
kamera.fov = 30
kamera.fare = 0.004

# ---- display
display.width = 1920
display.height = 1080
display.spp = 2
goruntu.ev = 0.5
