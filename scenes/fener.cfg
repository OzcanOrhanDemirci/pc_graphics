# pc_graphics scene 2 "Fener" (Inside-style lighthouse). F5 in the window reloads this file and the device programs.
# Lengths in metres, angles in degrees, radiance in the renderer's linear units (display.ev scales them).
# Values that are deliberately not physical (art) are marked "art". Plan: docs/fener/PLAN.md, state: docs/fener/DURUM.md.

time = 0

# --- the moon: low in front of the camera (backlight: Inside's silhouettes)
moon.dir = -0.15 0.30 1
moon.radius_deg = 0.55        # art: the real moon is 0.26
moon.E = 0.040 0.046 0.056
moon.disc = 0.24 0.25 0.26

# --- the lamp: two opposite beams, one turn every lamp.period seconds
lamp.I = 900000
lamp.period = 14
lamp.phi0_deg = 38
lamp.direction = 1
lamp.beam_w_deg = 3.2
lamp.beam_wv_deg = 3.5
lamp.beam_tilt_deg = -3.0
lamp.spill_k = 0.05           # art: weak downward lobe that sweeps the forest and the sea
lamp.spill_wv_deg = 12
lamp.spill_tilt_deg = -15
lamp.leak = 900
lamp.surface_k = 0.06         # art: the beam on surfaces (turned down: it reveals, it does not floodlight)
lamp.glass_base = 0.5
lamp.glass_k = 60
lamp.color = 1.0 0.97 0.92

# --- the cabin's window (the only warm colour)
window.radiance = 0.9 0.36 0.10
window.emission = 1.6 0.62 0.17

# --- fog
fog.rho0 = 0.001923           # 1/520 per metre at sea level
fog.height = 55
fog.haze = 0.0000455          # 1/22000
fog.ground = 0.00625          # ground mist, 1/160 per metre at the water
fog.ground_height = 7
fog.ambient = 0.0025 0.0030 0.0035
fog.halo = 0.25
fog.halo_g = 0.75
sky.night = 0.0010 0.0014 0.0022
water.deep = 0.0004 0.0008 0.0010
water.moon_glint = 13         # art

# --- volume pass
volume.scale = 1               # 1 full resolution, 2 half (cheaper; bright halos on near silhouettes)
volume.lamp_samples = 8
volume.moon_samples = 4
volume.beam_scale = 2.6
volume.beam_cap = 0.09        # art: soft ceiling on the beam in the fog
volume.moon_scale = 1.0
volume.beam_g = 0.15          # art: a real fog scatters forward ~100x more than sideways; here ~5x
volume.beam_halo = 0.15

# --- display
display.ev = 3.39
display.glow_wide = 0.05
display.glow_narrow = 0.45
display.glow_threshold = 1.5
display.vignette = 0.28
display.taa_alpha = 0.10
display.adapt = 0.5           # the eye opens under the canopy (share of the difference)
display.adapt_ref = -7.2      # metered log2 luminance of the open views (A -7.0, B -7.4): they keep display.ev
display.adapt_min = -1
display.adapt_max = 3
display.adapt_seconds = 1.5

# --- world
island.hill = 44
terrain.step = 1.25
terrain.step_cam = 1.25
forest.spacing = 4.4
forest.glades = 0.63
forest.gaps = 0.08
view.A.pos = 0 0 -470
view.A.eye = 1.7
view.A.pitch = 5
view.A.fov = 38
view.B.pos = 690 0 -540
view.B.eye = 1.7
view.B.pitch = 10
view.B.fov = 48
view.B.yaw = 9

# --- materials
mat.needle_wrap = 0.25
