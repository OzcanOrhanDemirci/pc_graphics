# Sahne 11 "Orman": yağmurdan sonra erken sabah, derenin kıyısında, her yanı süren bir yağmur ormanı. Anahtar = değer; --set anahtar=değer ile
# ezilir; F5 ayarları ve programları yeniden yükler (dünya ve pişmiş ışık yerinde kalır). Plan docs/orman/PLAN.md.
width = 2560
height = 1440
dlss = 1               # NVIDIA DLSS Ray Reconstruction (DLAA): pikselde her karede bir örnek, kareler birikir; 0: sabit örnekler
samples = 4            # pikselde sabit desenli görünürlük ışını (1, 4, 8, 16), DLSS kapalıyken
filter.sigma = 0.42    # yeniden yapılandırma süzgeci (Gauss, piksel): örnekler bu dağılımdan, hepsi eşit ağırlıkta

# dünya
world.size = 44        # derenin parçasının kenarı (m); orman karosunun kenarı da bu
world.walk = 30        # parçanın yapıldığı orta (bakışlar, kenarındaki fidan kuşağı); son 5 m'de zemini karoya bağlanır
world.cells = 4        # parçanın çevresinde her yöne bu kadar karo (4: 9 x 9, 396 m; kenarları birbirine dikili, duvar yok); 0: yalnız parça
world.window = 4       # gözün çevresinde her yöne bu kadar hücre (en az world.cells; ≥ 176 m, bakış oraya varmıyor)
world.seed = 11
ground.res = 0.05      # zeminin köşe aralığı (m)
young.trees = 10       # parçanın (ve karonun) içinde genç ağaçlar: fidanlarla tepe arasındaki orta kat (ışığın aralığında yok)
# alt katın yoğunluğu: her katın kendi sebepli dağılımı bu katsayıyla çarpılır (olasılık 1'de doyar)
dense.floor = 1.5      # eğreltiler ve küçük otlar (kıyıda sık), geniş yapraklı öbekler
dense.shrub = 1.8      # göz hizasında çalılıklar, aralarında geçit
dense.sapling = 1.6    # fidanlar: diz boyundan küçük ağaca
dense.debris = 1.0     # kabuk ve kuru dal
dense.litter = 1.4     # yere düşmüş yapraklar (ambientCG LeafSet atlasları); 0: hiç
ground.material = forest_leaves_02
ground.tile = 3.0      # zemin taramasının bir karosu (m; Poly Haven'ın ölçüsü)
stream.depth = 0.55
stream.width = 1.1
assets.skip =          # virgülle: yüklenmeyecek varlıklar

# ışık (göreli birimler; pozlama kendini ayarlar)
sun.elevation = 25     # derece
sun.azimuth = 15       # derece, +x'ten +z'ye
sun.intensity = 3.0
sun.color = 1.0 0.9 0.76
sun.radius = 0.27      # güneşin açısal yarıçapı (derece)
sky.zenith = 0.16 0.26 0.48
sky.horizon = 0.42 0.47 0.52
sky.intensity = 1.0
gi.scale = 1.0
ao.radius = 0.6        # zeminin kendi kapanması: bitkilerin altı (m)
ao.rays = 48
ao.power = 1.0
grid.spacing = 0.3     # pişmiş ışığın yoklama aralığı (m)
grid.rays = 192
grid.passes = 2        # 1: gök + güneş; 2: bir sekme daha
grid.top = 40

# görüntü
exposure = 0.0         # durak (EV), göz uyumunun üstüne
exposure.auto = 1
exposure.key = 0.14
exposure.max = 200
bloom = 0.04
vignette = 0.25
saturation = 1.15      # AgX tek başına soluk
debug = 0              # 1 renk, 2 normal, 3 yalnız pişmiş ışık, 4 yalnız güneş, 5 doku seviyesi

# yağmurdan sonra
wetness = 0.5          # 0 kuru .. 1 yeni yağmış: pürüzlü yüzeyler parlar
wet.gloss = 0.5        # ıslak parlaklığın gücü
fog.density = 0.0015   # her yerdeki pus (1/m)
fog.ground = 0.012    # yerde fazlası, fog.height (m) boyunca azalır
fog.height = 1.8
fog.g = 0.7            # öne saçılma (huzmeler güneşe bakınca parlar)
fog.far = 60
fog.steps = 24
fog.ambient = 0.5      # pusun ormanın kendi ışığından aldığı pay
vis.spacing = 0.1      # güneşin havadaki görünürlük hacmi (m): pusun huzmeleri
stream.water = 0.16    # derenin suyu: yatağın ortasından derinlik (m)
water.absorb = 1.6 2.4 4.5   # suyun soğurması (1/m, R G B): ormanın çay rengi suyu
water.flow = 0.35      # akış hızı (m/s)
