# Sahne 9 "Isı" (TASLAK: bilgisayarın içi, manzara boyunda). Anahtar = değer; --set anahtar=değer ile ezilir; F5 yeniden yükler.
# Taslağın amacı kompozisyonu ve içinde dolaşmanın hissini görmek (Özcan 2026-10-06). Ayrıntı yok.
width = 1920
height = 1080
samples = 2          # pikselde sabit örnek (köşegende iki)
samples.edge = 0     # canlıda kapalı (fotoğrafta 4): kenar ölçütü 1440p'de kareyi 40 ms'den 112 ms'ye çıkarıyordu
samples.contrast = 0.06
steps = 320          # ışın yürütmenin adım sınırı

exposure = 6.0
bloom = 0.06
vignette = 0.25

# pus: zeminden yükseldikçe incelen bir katman
fog.density = 0.0010
fog.height = 130

# gökten inen huzmeler (kasanın delikli panelinden)
sky.hole = 30         # deliklerin aralığı (m)
beam.fraction = 0.08  # deliklerin kaçından huzme iner
beam.sigma = 2.2      # huzmenin kalınlığı (m)
beam.le = 30
beam.lean.x = 0.16
beam.lean.z = 0.09

# sıcak parçaların ışıkları (uyanıklıkla çarpılır)
glow.le = 0.35
light.gpu = 6000
light.cpu = 1500
light.vrm = 2500
light.ram = 500
light.ssd = 900
light.psu = 9000

# pusun kendi rengi ve gökten yüzeylere düşen ışık (ölçek)
fog.le = 0.8
sky.le = 0.6
