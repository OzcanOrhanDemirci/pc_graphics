# Scene 8 "Denizalti": settings (key = value; --set key=value overrides; F5 reloads)
# the base mesh's longest edge (m): tessellation divides from here
geom.maxEdge = 0.012
# the camera's vertical field of view (degrees)
cam.fov = 60
# the picture's exposure (EV): a 40 W bulb at a metre lights a wall to ~7 cd/m2 (0.007 in the scene's units)
cam.ev = 4.7
# the oven: paths per texel, bounces, metres per texel
bake.samples = 1024
bake.bounces = 12
bake.texel = 0.002
