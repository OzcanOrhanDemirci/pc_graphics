# ---- Bal: honey off a dipper onto a glass dish (live)
bal.aralik_kaba = 0.0015
bal.ek_kapasite = 150000
bal.oturma = 0.2
bal.yogunluk = 1420
# honey: viscosity over each particle's own neighbours (Shepard) and repeated a substep, so a thin thread is as thick
# as the bulk (measured: with plain XSPH it ran like oil and spread thin); strong cohesion, wetting the glass
bal.fizik.xsph = 0.97
bal.fizik.xsph_shepard = 1
bal.fizik.viskozite_gecis = 12
bal.fizik.yapisma = 20
# viscoelastic springs between the thread's layers (Clavet 2005): their rest creeps after the length over 1 s (it flows,
# thins, does not fall apart), they let go 2.5 s after they were made (the coils on the dish merge into a pool). Without
# them the thread fell apart into drops (density is one-sided, cohesion pinches it: Rayleigh-Plateau)
bal.yaylar = 1
bal.fizik.yay_sertlik = 0.3
bal.fizik.yay_gevseme = 1.0
bal.fizik.yay_omur = 2.5
bal.fizik.islatma = 20
bal.fizik.sivi_kati_mu = 0.5
bal.fizik.sivi_zemin_mu = 0.9
bal.ip_yaricap = 0.004
bal.akis_en_az = 0.5
bal.akis_en_cok = 5.0
bal.ip_yaricap = 0.0030
bal.yukseklik_en_az = 0.05
bal.yukseklik_en_cok = 0.32

# ---- Kum: sand from a funnel (live)
kum.aralik_kaba = 0.0025
kum.ek_kapasite = 150000
kum.oturma = 0.2
kum.yogunluk = 1600
# grains: friction shared among contacts by sqrt (like the push it crept: 14 deg), 4 passes, and static friction at the
# velocity level (a grain slower than 1.2 cm/s stops): the pile stands at 32.5 deg (--lab-test kum; dry sand 30-35)
kum.fizik.yineleme = 4
kum.fizik.tane_pay = 0.5
kum.fizik.tane_durgun = 0.012
kum.fizik.mu_statik = 0.8
kum.fizik.mu_dinamik = 0.6
kum.fizik.zemin_mu_statik = 0.8
