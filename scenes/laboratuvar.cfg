# ---- Balon: a water balloon pricked by a needle
balon.aralik_kaba = 0.003
balon.aralik_ince = 0.002
balon.ince_alt_adim = 4
balon.kayit_hiz = 1000
balon.kayit_sure = 1.2
balon.oturma = 1.5
balon.yaricap = 0.06
balon.asili = 0
balon.merkez = 0 0.062 0
# latex: E ~ 1.5 MPa, ~0.15 mm thick when stretched: a bond ~ E t = 225 N/m (compliance 4e-3 m/N); its rest length
# 0.6 of the filled one (a tension ~150 N/m, ~5 kPa inside, a real water balloon's); it tears at 2.4x its rest
# the bonds' Gauss-Seidel passes a substep: with 2 the 3 mm membrane is soft (it stretched and tore under the water's
# weight); 12 holds it (2 of 31256 bonds in 2 s). A finer membrane needs more
balon.fizik.bag_yineleme = 12
balon.fizik.yineleme = 3
balon.ince_bag_yineleme = 20
balon.on_gerilme = 0.85
balon.kopma = 0.7
balon.uyum = 1e-3
# a tear's tip after the needle: bonds next to a broken one break at this share of their strain (0.6 left a 4% hole;
# 0.4 pops it: 45% of the bonds in 5 ms)
balon.yirtilma_ucu = 0.4
balon.dugum_yaricap = 0.015

# ---- Karpuz: a watermelon shot with a rifle
karpuz.aralik_kaba = 0.004
karpuz.aralik_ince = 0.0025
karpuz.ince_alt_adim = 4
karpuz.kayit_hiz = 1000
karpuz.kayit_sure = 1.2
karpuz.oturma = 1.0
# Young's moduli (Pa) and breaking strains: the rind stiff and brittle, the flesh soft and crisp
karpuz.kabuk_E = 15e6
karpuz.et_E = 1.0e6
karpuz.kabuk_kopma = 0.05
karpuz.et_kopma = 0.15
karpuz.kusur = 0.6
# the share of the bullet's deposited energy given at once to the flesh as the temporary cavity's radial flow. In
# gelatin most of it goes there; here it is handed over as velocity with nothing to slow it (the flesh's bonds break
# at 15%), so 0.5 turned the melon to confetti in 6 ms. 0.15: it swells for a few milliseconds, then the rind opens
# like a crown (slow-motion footage of rifle shots looks so). A calibration by eye, not a measurement.
karpuz.bosluk_payi = 0.15
karpuz.yaricap = 0.088 0.08 0.08

