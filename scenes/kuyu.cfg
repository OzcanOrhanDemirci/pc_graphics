# Sahne 10 "Kuyu": aynalı odalardan sonsuz bir kafeste düşüş. Anahtar = değer; --set anahtar=değer ile ezilir; F5 yeniden yükler.
# Ayar paneli yok (Ayna'dan kalıcı karar): kaliteyi 2560x1440'ta bu dosya belirler, hedef 30-40 FPS.
width = 2560
height = 1440
samples = 6            # pikselde sabit örnek (6 kale deseni)
cone.scale = 0.6       # ışının izdüşümü (desenler ve küçük ışıklar bununla süzülür)
recon = 0.12           # yeniden yapılandırma: pikselin örnekleri komşulara bu yan ağırlıkla taşar
min.weight = 0.000001  # oda içinde yol, girişteki ağırlığının bu payının altına inince biter (asıl kesme cut.eps: görünmezlik sınırı)
max.bounces = 256
max.cells = 160
reflections = 1        # camın dış yansıması izlenir

exposure = 6.0
bloom = 0.04
vignette = 0.2

# kafes
lattice.cell = 8.0     # hücre (m)
room.half = 1.8        # odanın iç yarı boyu: 3,6 m'lik küp
room.frame = 0.04      # camın serbest kenarlarındaki bakır çerçeve
bundle.width = 0.6     # demetin genişliği
bundle.gap = 0.03      # demet ile camın dış yüzü arası
bundle.relief = 0.03   # çıtaların kabartması
bundle.slats = 7       # demet yüzünde çıta

# duvar: içte gümüş film, yarım inç gri cam, dışta yansıma önleyici
wall.film = 45         # gümüş film (nm): içeriden %95,8 / %94,5 / %90,9 yansıtır (610 / 550 / 465 nm)
wall.glass = 0.0127    # gri float cam (m)
wall.grey.tv = 0.18    # 12,7 mm gri camın görünür geçirgenliği (GGI veri sayfası)
wall.ar = 0.005        # yansıma önleyici kaplama, dik gelişte

# odalardaki ışıklar
bulb.radius = 0.02
bulb.star = 2.5        # yıldız odalarının ampulleri (cd)
bulb.single = 12.0     # tek lambalı odalar (cd)

# pus
haze.sigma = 0.006
haze.absorb = 0.001
haze.cover = 0.3       # pusun gördüğü çevrenin camla kaplı payı (ortam ışığı = odaların ortalama parıltısı x bu)
light.rooms = 27
glow.grid = 64
light.rays = 4096      # yapının ışık tablosu: texel başına kosinüs ağırlıklı ışın (Fibonacci)
light.texel.along = 0.02
light.texel.across = 0.025
boost.tau = 1.3        # Shift basılıyken hız her bu kadar saniyede e katına çıkar
boost.max = 1200000    # hızın tavanı (m/s; Özcan: 1,2 milyon). 130 m/s üstünde kafes kare başına yarım hücreden çok ilerler: iskelet durur, titrer, geri gider gibi görünür, odalar her kare başka (ilüzyon)
