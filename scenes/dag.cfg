# Sahne 13 "Dağ": Kaçkar'ın tepesinde gün batımı, gerçek yeryüzü hava sınırına kadar. Anahtar = değer; --set anahtar=değer ile
# ezilir; F5 ayarları, havanın tablolarını ve programları yeniden yükler (yeryüzü yerinde kalır). Plan docs/dag/PLAN.md.
width = 2560
height = 1440
samples = 16           # pikselde sabit desenli ışın (4, 8, 16)
filter.sigma = 0.40    # yeniden yapılandırma süzgeci (Gauss, piksel)
fov = 45               # dikey görüş (derece)

# güneş: temmuz akşamı, batış azimutu; yükseklik terastan (ufuk -1,9 derecede)
sun.azimuth = 299
sun.elevation = 1.5
sun.E = 1.7 1.85 1.9

# hava
air.bending = 0.13     # havanın olağan kırılması: Dünya'nın etkin yarıçapı R / (1 - k)
air.rayleigh = 1.0
air.mie = 1.5e-6       # yere yakın pus (1/m)
air.mieH = 1200
air.mieG = 0.8
air.haze = 0.4e-6      # yüksek ince toz
air.hazeH = 4000
air.shadow = 1         # dağların havadaki gölgesi

# uzak ağ: hücre adımı, mesafe bandı (m)
far.step1 = 1
far.step2 = 1
far.step3 = 1
far.band1 = 2000000
far.band2 = 3000000
far.lines = 72000
far.tolerance = 0.001

# yakın zemin
near.radius = 1500
near.az = 4096
near.r0 = 0.05
mid.radius = 30000     # kayanın kırılmasının sürdüğü yer (m); ötesi modelin kendisi
mid.az = 8192

# deniz
sea.slope2 = 0.022
sea.colour = 0.006 0.018 0.028

# ince bulut (0: yok)
cirrus.cover = 0.55
cirrus.thick = 0.07
cirrus.tile = 240000
cirrus.stretch = 7

# görüntü
exposure = 2.2
bloom = 0.02
vignette = 0.08
saturation = 1.35
lift = 2.2             # karanlıkta gözün açılması: siyaha yakın kazanç 1 + bu
lift.knee = 0.06
albedo.gain = 0.55

# kaya
rock.gain = 1.3        # taramanın rengi (granit)
rock.disp = 0.15       # terasın taşlarının yüksekliği (m)
stones.count = 1500    # terasın çevresinde taranmış kaya kopyası
